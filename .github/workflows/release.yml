name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag the plugin version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version plugins/qaf/.claude-plugin/plugin.json)
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists"
            exit 0
          fi
          awk -v h="## $version " 'index($0, "## ") == 1 { p = index($0, h) == 1; next } p' plugins/qaf/CHANGELOG.md > notes.md
          gh release create "$tag" --target "$GITHUB_SHA" --title "Qaf $version" --notes-file notes.md
